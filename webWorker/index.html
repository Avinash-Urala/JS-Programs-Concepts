<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Web Worker Example</h1>
    <p>Click the button to run a worker in the background.</p>
    <button id="startWorkerButton">Start Worker</button>
    <p id="result"></p>
    <script>
        const startWorkerButton = document.getElementById('startWorkerButton');
        const resultDisplay = document.getElementById('result');

        startWorkerButton.addEventListener('click', () => {
            const worker = new Worker('./worker.js');

            worker.postMessage([1, 2, 3, 4, 5]);

            worker.onmessage = function(e) {
                console.log('Received from worker' + e.data);
                resultDisplay.textContent = e.data;
            }
        })
    </script>
</body>
</html>
