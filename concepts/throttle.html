<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>JS Bin</title>
</head>
<body>
  <button id="btn">Click me !</button>
  <script>
      function throttle(fn, interval) {
        let lastTime = 0;
        return function(...args) {
          let now = Date.now();
          if((now - lastTime) > interval) {
            fn.apply(this, args);
            lastTime = now
          }
        }
      }
    
    function handleClick() {
      console.log('clicked !!');
    }
    
    const handleThrottle = throttle(handleClick, 2000);
    
    document.getElementById('btn').addEventListener('click', handleThrottle);
  </script>
</body>
</html>
